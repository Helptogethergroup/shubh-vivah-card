<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shubh Vivah Invitation</title>
<meta name="theme-color" content="#22110a">
<meta property="og:title" content="Shubh Vivah - Wedding Invitation">
<meta property="og:description" content="You are warmly invited to our wedding celebrations.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&amp;family=Hind:wght@400;500;600&amp;family=Tiro+Devanagari+Hindi:ital@0;1&amp;display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style id="card-css">
/* Layout: full-width cream bands stacked like pages of a printed shaadi card (arch cover, maroon countdown, couple, calendar, programs, gallery, venue, families, RSVP); language pill fixed top-right; owner-only edit drawer. */
:root{
  --cream:#fbf3e1; --cream-2:#f5e6c6; --paper:#fffaf0; --maroon:#7b1e34; --maroon-2:#52101f; --on-maroon:#fbe9c0; --maroon-gold:#f3d58b;
  --gold:#b8862b; --gold-2:#dcae4e; --marigold:#e8872a; --rose:#c2445f; --ink:#3b2222; --mute:#7b5f55;
  --line:rgba(184,134,43,.5);
  --blush:#f7d9d6; --blush-2:#fdeae4; --leaf:#7f9a6c;
  --g1:#fff7e2; --g2:#fde8c8; --g3:#fadad4; --g4:#fff1d0;
  --edge:#d9c79a; --field:#fffdf6; --ok:#2f7d57; --err:#a63b3b;
  --f-disp:'Cormorant Garamond','Tiro Devanagari Hindi',Georgia,serif;
  --f-body:'Hind','Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
a{color:inherit}

.band{position:relative;z-index:1}
.band .in{max-width:760px;margin:0 auto;text-align:center;padding-block:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.paper{background-color:var(--cream);background-image:radial-gradient(rgba(184,134,43,.1) 1px,transparent 1.4px);background-size:20px 20px}
.paper2{background:linear-gradient(180deg,var(--cream-2),var(--cream))}
.maroon{background:linear-gradient(135deg,var(--maroon-2),var(--maroon) 55%,#6a1830);color:var(--on-maroon)}
.hero{background:linear-gradient(120deg,var(--g1),var(--g2),var(--g3),var(--g4));background-size:300% 300%;animation:bgflow 22s ease-in-out infinite;overflow:hidden}
.hero .in{padding-top:30px}

.toran{height:56px;color:var(--gold)}
.toran svg{display:block;width:100%;height:56px}

.lang{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));display:flex;border:1px solid var(--gold);border-radius:999px;background:rgba(255,250,240,.94);backdrop-filter:blur(6px);padding:3px;box-shadow:0 4px 14px rgba(123,30,52,.15)}
.lang button{background:none;border:0;border-radius:999px;padding:4px 14px;cursor:pointer;color:var(--mute);font-size:.9rem}
.lang button[aria-pressed="true"]{background:var(--maroon);color:var(--on-maroon);font-weight:600}

.invo{font-family:var(--f-disp);font-style:italic;font-weight:600;font-size:1.5rem;color:var(--head);margin:0 0 22px;line-height:1.3}
.arch{margin:0 auto;max-width:520px;border:2px solid var(--gold);border-radius:999px 999px 20px 20px;padding:42px 22px 36px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,250,240,.4));box-shadow:0 0 0 6px var(--g1),0 0 0 7px var(--line),0 26px 60px rgba(123,30,52,.18)}
.mandala{width:min(170px,50vw);margin:0 auto 14px;color:var(--gold);animation:glow 6s ease-in-out infinite}
.mandala svg{display:block;width:100%;height:auto;animation:spin 120s linear infinite}
.archimg{display:block;width:min(210px,62%);aspect-ratio:3/4;object-fit:cover;margin:0 auto 16px;border-radius:999px 999px 14px 14px;border:3px solid var(--gold);box-shadow:0 10px 28px rgba(123,30,52,.25)}
.intro{max-width:36ch;margin:0 auto 16px;color:var(--ink);font-family:var(--f-disp);font-weight:600;font-size:1.2rem;line-height:1.5}
html[lang="hi"] .intro{font-size:1.1rem;line-height:1.7}
h1{font-family:'Great Vibes','Tiro Devanagari Hindi',var(--f-disp);font-weight:400;font-size:clamp(3.4rem,15vw,6rem);line-height:1.12;margin:0 0 14px;display:flex;flex-direction:column;align-items:center;gap:0;text-wrap:balance}
h1 span:not(.amp){background:linear-gradient(100deg,var(--maroon),var(--rose),var(--marigold),var(--maroon));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shine 8s linear infinite}
h1 .amp{font-style:italic;font-weight:500;font-size:.5em;color:var(--gold);line-height:1.1}
html[lang="hi"] h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(2.6rem,11.5vw,4.4rem);line-height:1.3}
.when{font-family:var(--f-disp);font-size:1.55rem;font-weight:700;color:var(--head);margin:0}
.where{margin:2px 0 0;color:var(--mute)}

.st{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.8rem,6.5vw,2.5rem);line-height:1.15;color:var(--head);margin:0;text-wrap:balance}
html[lang="hi"] .st{line-height:1.35}
.maroon .st{color:var(--maroon-gold)}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px auto 30px;color:var(--gold);max-width:260px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--line)}
.orn i{width:8px;height:8px;background:currentColor;transform:rotate(45deg)}
.maroon .orn{color:var(--maroon-gold)}

.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:520px;margin:0 auto}
.cd div{border:1px solid rgba(243,213,139,.55);border-radius:14px;padding:12px 4px 8px;background:rgba(255,255,255,.06)}
.cd b{display:block;font-family:var(--f-disp);font-size:clamp(1.8rem,8vw,2.7rem);line-height:1.1;color:var(--maroon-gold);font-variant-numeric:tabular-nums}
.cd span{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
html[lang="hi"] .cd span{letter-spacing:0;text-transform:none;font-size:.9rem}
.muh{margin:22px 0 0;font-family:var(--f-disp);font-style:italic;font-size:1.3rem;color:var(--maroon-gold)}

.story{max-width:46ch;margin:0 auto 34px;font-family:var(--f-disp);font-size:1.3rem;line-height:1.55;font-style:italic;color:var(--ink)}
html[lang="hi"] .story{line-height:1.8;font-size:1.15rem}
.story::before{content:"\201C";display:block;font-size:3.4rem;line-height:.6;color:var(--gold-2)}
.pair2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.cp{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:26px 20px;box-shadow:0 12px 30px rgba(123,30,52,.08);min-width:0}
.cp .av{width:132px;height:132px;border-radius:50%;margin:0 auto 14px;border:3px solid var(--gold);padding:4px;background:var(--paper);display:block}
.cp .av img,.cp .av div{width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:3rem;font-weight:700;color:var(--on-maroon);background:linear-gradient(135deg,var(--maroon),var(--rose))}
.role{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0}
html[lang="hi"] .role{letter-spacing:0;text-transform:none;font-size:.95rem}
.cp h3{font-family:var(--f-disp);font-size:2rem;margin:0 0 6px;color:var(--head);line-height:1.2}
.cp p:last-child{margin:0;color:var(--mute);font-size:.95rem}

.bigdate{font-family:var(--f-disp);font-weight:700;color:var(--head);margin:0 0 24px;line-height:1.1;font-size:clamp(1.7rem,7vw,2.4rem)}
.cal{max-width:340px;margin:0 auto 26px;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 12px 30px rgba(123,30,52,.1)}
.calh{background:linear-gradient(120deg,var(--maroon-2),var(--maroon));color:var(--maroon-gold);font-family:var(--f-disp);font-weight:700;font-size:1.35rem;padding:10px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px;text-align:center}
.calg span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:.92rem;font-variant-numeric:tabular-nums}
.calg .wd{font-size:.72rem;color:var(--gold);font-weight:600;aspect-ratio:auto;padding-bottom:2px}
.calg .ev{background:rgba(184,134,43,.22)}
.calg .on{background:var(--maroon);color:var(--on-maroon);font-weight:700;box-shadow:0 0 0 3px rgba(194,68,95,.3);animation:pulse 2.4s ease-in-out infinite}

.day{margin:0 0 30px;text-align:left}
.dayh{font-family:var(--f-disp);font-size:1.55rem;font-weight:700;color:var(--head);margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.prl{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.pr{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;transition:transform .25s,box-shadow .25s}
.pr:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(123,30,52,.14)}
.tm{align-self:start;text-align:center;font-size:.9rem;font-weight:600;line-height:1.3;color:var(--on-maroon);background:linear-gradient(135deg,var(--maroon),var(--rose));border-radius:12px;padding:8px 6px}
.pr h3{font-family:var(--f-disp);font-size:1.45rem;margin:0;line-height:1.2;color:var(--head)}
.pr p{margin:2px 0 0;overflow-wrap:anywhere;color:var(--mute)}
.pr .nt{color:var(--gold);font-weight:500;font-size:.92rem}

.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.gal{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
.gt{position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;border:2px solid var(--paper);box-shadow:0 8px 20px rgba(123,30,52,.18);padding:0;background:var(--cream-2);cursor:default;display:block;transition:transform .3s}
button.gt{cursor:zoom-in}
.gt:hover{transform:scale(1.03) rotate(-.6deg)}
.gt img{width:100%;height:100%;object-fit:cover;display:block}
.gt span{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 8px;color:#fff;font-family:var(--f-disp);font-weight:600;font-size:1.05rem;line-height:1.2;background:linear-gradient(0deg,rgba(60,15,30,.78),transparent)}
.gt.ph{display:flex;align-items:center;justify-content:center}
.gt.ph0{background:linear-gradient(145deg,var(--maroon),var(--rose))}
.gt.ph1{background:linear-gradient(145deg,var(--marigold),var(--gold-2))}
.gt.ph2{background:linear-gradient(145deg,var(--maroon-2),var(--gold))}
.gt.ph svg{width:62%;height:auto;color:rgba(255,255,255,.55);margin-bottom:22px}
.lb{position:fixed;inset:0;z-index:40;background:rgba(40,12,20,.9);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:92vh;border-radius:10px;border:3px solid var(--gold)}

.vn{font-family:var(--f-disp);font-size:2rem;font-weight:700;color:var(--head);margin:0 0 4px;line-height:1.2}
.addr{margin:0 auto 18px;max-width:40ch;color:var(--mute);overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{display:inline-block;position:relative;overflow:hidden;border:1.5px solid var(--maroon);background:none;color:var(--head);padding:9px 22px;border-radius:999px;text-decoration:none;cursor:pointer;font-weight:500;transition:transform .2s,box-shadow .2s,background .2s,color .2s}
.btn:hover{background:var(--maroon);color:var(--on-maroon);transform:translateY(-2px);box-shadow:0 8px 18px rgba(123,30,52,.28)}
.btn.solid{background:linear-gradient(120deg,var(--maroon),var(--rose));color:var(--on-maroon);border-color:transparent}
.btn.solid::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 3.6s ease-in-out infinite}
.note{max-width:46ch;margin:28px auto 0;padding:16px 18px;background:var(--paper);border:1px dashed var(--gold);border-radius:14px;color:var(--mute);text-align:left;font-size:.95rem}
.note b{display:block;color:var(--head);font-family:var(--f-disp);font-size:1.2rem;margin-bottom:2px}

.fam{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.fam>div{padding:20px 14px;background:var(--paper);border:1px solid var(--line);border-radius:18px;min-width:0}
.fam h3{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--gold);margin:0 0 6px}
html[lang="hi"] .fam h3{letter-spacing:0;text-transform:none;font-size:1rem}
.fam p{margin:0;font-family:var(--f-disp);font-size:1.4rem;font-weight:600;color:var(--head);line-height:1.35}
html[lang="hi"] .fam p{line-height:1.6}
.wish{margin:26px auto 0;max-width:44ch;color:var(--mute);font-style:italic}

.rnm{font-family:var(--f-disp);font-size:1.7rem;font-weight:700;color:var(--head);margin:0}
.rby{color:var(--mute);margin:0 0 6px}
.rph{font-size:1.3rem;letter-spacing:.04em;margin:0 0 16px;font-variant-numeric:tabular-nums;font-weight:500}
.flash{min-height:1.4em;margin:10px 0 0;font-size:.88rem;color:var(--mute)}

.close{font-family:var(--f-disp);font-style:italic;font-weight:600;font-size:clamp(1.5rem,5.5vw,2rem);color:var(--maroon-gold);margin:0 0 10px;line-height:1.35}
html[lang="hi"] .close{line-height:1.6}
.sign{font-family:var(--f-disp);font-size:1.2rem;margin:0;opacity:.9}
.maroon.foot .in{padding-block:50px 70px}

@keyframes bgflow{0%,100%{background-position:0 0}50%{background-position:100% 100%}}
@keyframes shine{to{background-position:-250% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(184,134,43,.3))}50%{filter:drop-shadow(0 0 14px rgba(232,135,42,.6))}}
@keyframes sweep{to{transform:translateX(120%)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(194,68,95,.3)}50%{box-shadow:0 0 0 7px rgba(194,68,95,.12)}}
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
main:not(.settled):not(.wait) .band .in>*{animation:rise 1s cubic-bezier(.2,.7,.2,1) backwards}
main:not(.settled):not(.wait) .band .in>*:nth-child(2){animation-delay:.15s}
main:not(.settled):not(.wait) .band .in>*:nth-child(3){animation-delay:.3s}
main:not(.settled):not(.wait) .band .in>*:nth-child(n+4){animation-delay:.45s}

/* illustrated cover */
.lang{z-index:60}
.ganesh{position:relative;width:min(210px,56vw);margin:0 auto 6px;animation:float 5s ease-in-out infinite}
.ganesh svg{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 18px rgba(184,134,43,.4))}
.halo{position:absolute;inset:-9%;border-radius:50%;background:radial-gradient(circle,rgba(255,233,168,.95),rgba(255,233,168,.38) 52%,rgba(255,233,168,0) 70%)}
.halo::after{content:"";position:absolute;inset:7%;border-radius:50%;border:1.5px dashed var(--gold);opacity:.75;animation:spin 60s linear infinite}
.gimg{position:relative;display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(184,134,43,.35))}
.gpre{visibility:hidden}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.scene{max-width:440px;margin:0 auto 18px;filter:drop-shadow(0 22px 30px rgba(123,30,52,.25))}
.scene svg{display:block;width:100%;height:auto}
.tw{animation:twinkle 2.2s ease-in-out infinite}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.6s ease-in-out infinite}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite alternate}
.ringspin{transform-box:fill-box;transform-origin:center;animation:spin 70s linear infinite}
.diya{width:58px;margin:0 auto 6px}
.diya svg{display:block;width:100%;height:auto}
.toran svg{transform-origin:50% 0;animation:sway 5s ease-in-out infinite alternate}
.ladi{position:absolute;top:60px;width:40px;height:480px;transform-origin:50% 0;animation:sway2 5s ease-in-out infinite alternate;display:none;pointer-events:none}
.ladi.s{height:340px;animation-duration:6.5s;animation-direction:alternate-reverse}
.ladi.l{left:calc(50% - 430px)}.ladi.r{right:calc(50% - 430px)}
.ladi.l.s{left:calc(50% - 480px)}.ladi.r.s{right:calc(50% - 480px)}
.ladi svg{display:block;width:100%;height:100%}
@media (min-width:960px){.ladi{display:block}}
@keyframes sway2{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.88,1.14) rotate(4deg)}}
@keyframes sway{from{transform:skewX(-.9deg)}to{transform:skewX(.9deg)}}
.maroon.cdb::after,.maroon.foot::before{content:"";position:absolute;left:0;right:0;height:14px;background-repeat:repeat-x;background-size:28px 14px;pointer-events:none}
.maroon.cdb::after{bottom:0;background-image:radial-gradient(circle at 14px 14px,var(--cream) 13px,transparent 13.6px)}
.maroon.foot::before{top:0;background-image:radial-gradient(circle at 14px 0,var(--cream) 13px,transparent 13.6px)}

/* door-opening intro */
.gate{position:fixed;inset:0;z-index:50;display:flex;cursor:pointer;overflow:hidden}
.gate.open{pointer-events:none}
.door{flex:1;position:relative;background:linear-gradient(160deg,var(--blush-2),var(--cream) 55%,var(--cream-2));transition:transform 1.7s cubic-bezier(.75,0,.2,1)}
.door::before{content:"";position:absolute;top:3vh;bottom:3vh;border:2px solid var(--gold)}
.door.l::before{left:3vh;right:0;border-right:0;border-radius:999px 0 0 0}
.door.r::before{right:3vh;left:0;border-left:0;border-radius:0 999px 0 0}
.door::after{content:"";position:absolute;top:calc(3vh + 12px);bottom:calc(3vh + 12px);border:1px solid var(--line);background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(184,134,43,.12) 22px 23px)}
.door.l::after{left:calc(3vh + 12px);right:0;border-right:0;border-radius:999px 0 0 0}
.door.r::after{right:calc(3vh + 12px);left:0;border-left:0;border-radius:0 999px 0 0}
.door.l{box-shadow:inset -14px 0 30px rgba(184,134,43,.25)}
.door.r{box-shadow:inset 14px 0 30px rgba(184,134,43,.25)}
.gate.open .door.l{transform:translateX(-101%)}
.gate.open .door.r{transform:translateX(101%)}
.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(300px,84vw);padding:26px 14px 22px;text-align:center;border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,var(--paper) 62%,rgba(255,250,240,0) 71%);transition:opacity .7s,transform 1s}
.gate.open .seal{opacity:0;transform:translate(-50%,-50%) scale(1.35)}
.seal .sm2{width:104px;color:var(--gold);margin-bottom:4px}
.seal .sm2 svg{display:block;width:100%;height:auto;animation:spin 40s linear infinite}
.g1{font-family:var(--f-disp);font-size:2.3rem;font-weight:700;color:var(--head);margin:0;line-height:1.2}
.g2{font-family:'Great Vibes',cursive;font-size:2rem;color:var(--rose);margin:0;line-height:1.2}
.g3{font-size:.8rem;color:var(--mute);margin:6px 0 0;animation:pulse2 2s ease-in-out infinite;max-width:20ch}
@keyframes pulse2{0%,100%{opacity:.5}50%{opacity:1}}

/* reveal on scroll (CSS only; items never start fully hidden) */
@keyframes reveal{from{opacity:.2;transform:translateY(34px) scale(.97)}to{opacity:1;transform:none}}
@supports (animation-timeline:view()){.rv{animation:reveal linear backwards;animation-timeline:view();animation-range:entry 0% entry 55%}}

/* owner edit drawer */

function calHtml(){
  const d=pd(S.date);if(!d)return '';
  const y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  const evd=(S.events||[]).map(e=>pd(e.date)).filter(x=>x&&x.getFullYear()===y&&x.getMonth()===m).map(x=>x.getDate());
  let h='<div class="cal rv"><div class="calh">'+esc(d.toLocaleDateString(loc(),{month:'long',year:'numeric'}))+'</div><div class="calg">';
  for(let i=0;i<7;i++)h+='<span class="wd">'+esc(new Date(2023,0,1+i).toLocaleDateString(loc(),{weekday:'short'}))+'</span>';
  for(let i=0;i<first;i++)h+='<span></span>';
  for(let k=1;k<=n;k++)h+='<span class="'+(k===d.getDate()?'on':evd.indexOf(k)>-1?'ev':'')+'">'+k+'</span>';
  return h+'</div></div>';
}
function gcalUrl(){

let gCut=null,gBusy='';
function prepGanesh(src){
  if((gCut&&gCut.src===src)||gBusy===src)return;
  gBusy=src;
  const im=new Image();
  const show=()=>document.querySelectorAll('.gpre').forEach(e=>e.classList.remove('gpre'));
  im.onload=()=>{
    try{
      const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;
      const x=c.getContext('2d');x.drawImage(im,0,0);
      const d=x.getImageData(0,0,c.width,c.height),p=d.data;
      for(let i=0;i<p.length;i+=4){const m=Math.min(p[i],p[i+1],p[i+2]);p[i+3]=Math.max(0,Math.min(255,(250-m)*5))}
      x.putImageData(d,0,0);
      gCut={src:src,data:c.toDataURL('image/png')};
      document.querySelectorAll('.gimg').forEach(e=>{e.src=gCut.data});
    }catch(e){}
    show();
  };
  im.onerror=show;
  im.src=src;
}

function splitWords(el){
  let n=0;
  const walk=node=>{
    Array.from(node.childNodes).forEach(c=>{
      if(c.nodeType===3){
        const f=document.createDocumentFragment();
        c.textContent.split(/(\s+)/).forEach(p=>{
          if(!p)return;
          if(/^\s+$/.test(p)){f.appendChild(document.createTextNode(p))}
          else{const s=document.createElement('span');s.className='w';s.style.setProperty('--i',Math.min(n++,24));s.textContent=p;f.appendChild(s)}
        });
        node.replaceChild(f,c);
      }else if(c.nodeType===1&&c.tagName!=='BR')walk(c);
    });
  };
  walk(el);
}
function wireText(){
  if(reduce||!('IntersectionObserver' in window))return;
  if(io){io.disconnect();io=null}
  const main=$('main');if(!main)return;
  main.classList.add('tx-on');
  main.querySelectorAll(TXT).forEach(el=>{
    if(el.closest('.tx'))return;
    el.classList.add('tx');
    if(el.tagName!=='H1')splitWords(el);
  });
  if(gateOpen)observeText();
}
function observeText(){
  if(reduce||!('IntersectionObserver' in window))return;
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target)}})},{threshold:.15,rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('.tx:not(.vis)').forEach(el=>io.observe(el));
}

    const each=fn=>document.querySelectorAll('img[data-cut]').forEach(e=>{if(e.getAttribute('data-cut')===src)fn(e)});
    const im=new Image();
    im.onload=()=>{
      try{
        const cv=document.createElement('canvas');cv.width=im.naturalWidth;cv.height=im.naturalHeight;
        const x=cv.getContext('2d');x.drawImage(im,0,0);
        const d=x.getImageData(0,0,cv.width,cv.height),p=d.data;
        for(let i=0;i<p.length;i+=4){const m=Math.min(p[i],p[i+1],p[i+2]);p[i+3]=Math.max(0,Math.min(255,(250-m)*5))}
        x.putImageData(d,0,0);
        c.data=cv.toDataURL('image/png');
        each(e=>{e.src=c.data});
      }catch(err){}
      each(e=>e.classList.remove('gpre'));
    };
    im.onerror=()=>each(e=>e.classList.remove('gpre'));
    im.src=src;
  }

function petals(){

  const c=document.createElement('canvas');c.id='petals';c.setAttribute('aria-hidden','true');document.body.insertBefore(c,document.body.firstChild);
  const x=c.getContext('2d'),P=[],cols=['#e8872a','#dcae4e','#c2445f','#f2a93b'];let W=0,H=0;
  const size=()=>{W=c.width=innerWidth;H=c.height=innerHeight};size();addEventListener('resize',size);
  const n=Math.max(10,Math.min(22,Math.round(W/50)));
  for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:4+Math.random()*5,s:.3+Math.random()*.6,w:Math.random()*6,a:Math.random()*6,c:cols[i%4]});
  (function loop(){
    x.clearRect(0,0,W,H);
    P.forEach(p=>{p.y+=p.s;p.w+=.015;p.x+=Math.sin(p.w)*.5;p.a+=.02;if(p.y>H+10){p.y=-10;p.x=Math.random()*W}
      x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=.55;x.fillStyle=p.c;x.beginPath();x.ellipse(0,0,p.r,p.r*.55,0,0,6.283);x.fill();x.restore()});
    requestAnimationFrame(loop);
  })();
}

async function shrink(file){
  try{

    const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);

    return b||file;
  }catch(e){return file}
}

    if(!Object.keys(obj).length)return;
    trSay('Translating everything…');
    try{
      const out=await sampler.json('Translate every value of this JSON object from English into Hindi (Devanagari script). The text is from an Indian wedding invitation. Write personal names and place names in Devanagari, translate the rest naturally and respectfully, keep digits and line breaks. Return a JSON object with exactly the same keys and the Hindi text as values, nothing else.\n\n'+JSON.stringify(obj),{modelTier:'default'});
      Object.keys(obj).forEach(k=>{if(out&&typeof out[k]==='string'&&out[k].trim())setp(k.replace(/\.en$/,'.hi'),out[k].trim())});
      fill();render();trSay('Hindi updated everywhere. Check it once, then press Save.');
    }catch(e){trErr(e)}
  }
  body.addEventListener('change',ev=>{
    const t=ev.target;
    if(t&&t.id==='autotr'){autoTr=t.checked;return}
    const p=t&&t.getAttribute&&t.getAttribute('data-p');
    if(autoTr&&sampler&&p&&/\.en$/.test(p))translateField(p,t);
  });
  $('#dundo').addEventListener('click',()=>{S=JSON.parse(stateEl.textContent);fill();render();say('Back to the last saved version.')});
  sb.addEventListener('click',()=>{
    sb.disabled=true;say('Saving…');
    artifact.publish(buildDoc()).then(()=>{say('Saved. Reloading the card…','ok')},e=>{
      const c=e&&e.code;
      say(c==='conflict'?'Someone saved a newer version first. The card has reloaded with their changes.':(c==='not_granted'||c==='not_writer')?'You do not have permission to save this card.':'Could not save. Check your connection and try again.','err');
    }).then(()=>{sb.disabled=false});
  });
}

addEventListener('hashchange',()=>{const h=hashLang();if(h&&h!==lang){lang=h;render()}});
render();
petals();
progress();
gate();
try{
  if(window.claude&&window.claude.use){
    Promise.all([window.claude.use('user'),window.claude.use('artifact'),window.claude.use('assets'),window.claude.use('sample')]).then(r=>{
      if(r[0]&&r[1]&&r[0].canEdit()){artifact=r[1];assets=r[2];sampler=r[3]||null;isAdmin=true;initAdmin();render()}
    },()=>{});
  }
}catch(e){}
})();
</script>
</body>
</html>
